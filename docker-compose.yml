version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: nodefund-dynamodb
    ports:
      - '8100:8000'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-dbPath', '/home/dynamodblocal/data']
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

  bff:
    build: .
    container_name: nodefund-bff
    ports:
      - '8000:8000'
      - '8001:8001'
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_TABLE_NAME=nodefund
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - COGNITO_USER_POOL_ID=local
      - COGNITO_APP_CLIENT_ID=local
      - AUTH_DISABLED=true
      - NODE_ENV=development
    depends_on:
      dynamodb-local:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  dynamodb-data:
