name: BFF — Testes & Deploy
on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  test:
    name: Testes Automatizados
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8100:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências Node
        run: npm ci
      - name: Instalar dependências Python
        run: python -m pip install -r requirements.txt
      - name: Criar tabela DynamoDB Local (Teste)
        run: |
          aws dynamodb create-table \
            --table-name nodefund \
            --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S \
            --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url http://localhost:8100
        env:
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_DEFAULT_REGION: us-east-1
      - name: Seed dados locais
        run: npm run setup:local
        env:
          DYNAMODB_ENDPOINT: http://localhost:8100
          DYNAMODB_TABLE_NAME: nodefund
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_REGION: us-east-1
      - name: Testes Node.js
        run: npm test
        env:
          DYNAMODB_ENDPOINT: http://localhost:8100
          DYNAMODB_TABLE_NAME: nodefund
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_REGION: us-east-1
          AUTH_DISABLED: 'true'
      - name: Testes Python
        run: npm run test:py
        env:
          DYNAMODB_ENDPOINT: http://localhost:8100
          DYNAMODB_TABLE_NAME: nodefund
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          AWS_REGION: us-east-1
          STORAGE_BACKEND: dynamodb

  deploy:
    name: Deploy Infra AWS e Aplicação
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          
      - name: 1. Deploy da Infraestrutura (CloudFormation)
        run: |
          aws cloudformation deploy \
            --template-file infra/cloudformation.yaml \
            --stack-name nodefund-bff \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: 2. Recuperar Parâmetros da Infraestrutura
        id: get-infra-params
        run: |
          ECR_URI=$(aws cloudformation describe-stacks --stack-name nodefund-bff --query "Stacks[0].Outputs[?OutputKey=='ECRRepositoryUri'].OutputValue" --output text)
          CLUSTER=$(aws cloudformation describe-stacks --stack-name nodefund-bff --query "Stacks[0].Outputs[?OutputKey=='ECSClusterName'].OutputValue" --output text)
          SERVICE=$(aws cloudformation describe-stacks --stack-name nodefund-bff --query "Stacks[0].Outputs[?OutputKey=='ECSServiceName'].OutputValue" --output text)
          
          echo "ECR_URI=$ECR_URI" >> $GITHUB_ENV
          echo "CLUSTER=$CLUSTER" >> $GITHUB_ENV
          echo "SERVICE=$SERVICE" >> $GITHUB_ENV

      - name: 3. Autenticar no Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: 4. Build e Push da Imagem Docker
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ env.ECR_URI }}:$IMAGE_TAG .
          docker push ${{ env.ECR_URI }}:$IMAGE_TAG
          docker tag ${{ env.ECR_URI }}:$IMAGE_TAG ${{ env.ECR_URI }}:latest
          docker push ${{ env.ECR_URI }}:latest
          
      - name: 5. Atualizar Serviço ECS Fargate
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service ${{ env.SERVICE }} \
            --force-new-deployment
